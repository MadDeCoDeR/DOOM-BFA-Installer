
name: Windows Build

on:
    workflow_call:

jobs:

  build:

    runs-on: windows-latest 

    env:
      Solution_Name: DBFAInstaller.sln                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Project_Directory: DBFAUpdater
      
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build dotnet
      run: dotnet restore -r win-x64 && dotnet publish -c Release -r win-x64 --self-contained true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: DBFA_Updater-windows-x64
        path: |
          ${{ env.Project_Directory }}\bin\Release\net10.0\win-x64\publish\DBFAUpdater.exe
          ${{ env.Project_Directory }}\bin\Release\net10.0\win-x64\publish\*.dll
